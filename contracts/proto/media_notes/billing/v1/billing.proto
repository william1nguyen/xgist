// Package media_notes.billing.v1 defines the billing service's synchronous
// read contract: quotes and billing summaries. Credit reservation and
// settlement are workflow mutations that enter through Kafka commands
// (mn.billing.credit.reserve.v1, mn.billing.credit.settle.v1), not gRPC —
// see docs/services/billing.md and ADR 0008.
syntax = "proto3";

package media_notes.billing.v1;

import "google/protobuf/timestamp.proto";

// BillingService owns billing accounts, subscriptions, catalog/quotes, and
// credit balances. Only hermes calls this service.
service BillingService {
  // GetQuote prices a set of processing options against the active catalog
  // version and returns a time-limited, immutable quote snapshot.
  rpc GetQuote(GetQuoteRequest) returns (GetQuoteResponse);
  // GetBillingSummary returns current credit balance and subscription
  // state for one user.
  rpc GetBillingSummary(GetBillingSummaryRequest) returns (GetBillingSummaryResponse);
  // ListCreditLedger returns a cursor-paginated page of one user's credit
  // ledger entries, newest first — the append-only reserve/settle/release/
  // purchase history backing the web app's usage charts.
  rpc ListCreditLedger(ListCreditLedgerRequest) returns (ListCreditLedgerResponse);
  // GetPriceCatalog returns every priced item in the active catalog
  // version. Callers must never hardcode a price locally — this is the
  // single source of truth a client renders a price list from before the
  // caller has made a selection to price with GetQuote.
  rpc GetPriceCatalog(GetPriceCatalogRequest) returns (GetPriceCatalogResponse);
  // ListPlans returns every subscribable plan, read live from Polar's
  // product catalog — never a locally configured list. Adding, archiving,
  // or editing a Polar product changes what this returns with no
  // deployment: Polar's dashboard is the plan catalog's source of truth.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  // ListCreditPacks returns every one-time credit top-up, read live from
  // Polar the same way ListPlans reads subscription plans.
  rpc ListCreditPacks(ListCreditPacksRequest) returns (ListCreditPacksResponse);
  // CreateCheckoutSession starts a Polar-hosted checkout for one plan or
  // credit pack (product_id is either a Plan.id or a CreditPack.id — the
  // checkout itself doesn't care which) and returns the URL to redirect
  // the user to. The resulting subscription or credit grant reaches
  // billing asynchronously through the Polar webhook, not through this
  // RPC's response.
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
  // CancelSubscription schedules the user's active subscription to end at
  // the current billing period's close (Polar's cancel-at-period-end
  // behavior) rather than revoking access immediately.
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
}

// QuoteItem is one priced option within a quote.
message QuoteItem {
  string item_id = 1;
  int64 credits = 2;
}

// Quote is an immutable, time-limited price snapshot for a set of
// processing options.
message Quote {
  string id = 1;
  string user_id = 2;
  string catalog_version = 3;
  repeated QuoteItem items = 4;
  int64 total_credits = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
}

// GetQuoteRequest carries a caller idempotency key and the canonical price
// item identifiers the user selected (for example "transcribe",
// "summarize", "generate_audio_summary").
message GetQuoteRequest {
  string idempotency_key = 1;
  string user_id = 2;
  repeated string options = 3;
}

// GetQuoteResponse returns the priced quote.
message GetQuoteResponse {
  Quote quote = 1;
}

message GetPriceCatalogRequest {
}

// GetPriceCatalogResponse returns the full active catalog: every item id
// the caller may pass to GetQuote, with its current price.
message GetPriceCatalogResponse {
  string catalog_version = 1;
  repeated QuoteItem items = 2;
}

// SubscriptionStatus is the lifecycle state of a billing subscription.
enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_NONE = 1;
  SUBSCRIPTION_STATUS_ACTIVE = 2;
  SUBSCRIPTION_STATUS_CANCELED = 3;
  SUBSCRIPTION_STATUS_PAST_DUE = 4;
}

// Subscription is the user's current subscription, if any.
message Subscription {
  string id = 1;
  string plan = 2;
  SubscriptionStatus status = 3;
  google.protobuf.Timestamp period_start = 4;
  google.protobuf.Timestamp period_end = 5;
}

// BillingSummary is current credit balance and subscription state for one
// user.
message BillingSummary {
  string user_id = 1;
  int64 available_credits = 2;
  int64 reserved_credits = 3;
  // subscription is unset when the user has never subscribed.
  Subscription subscription = 4;
}

// GetBillingSummaryRequest identifies the user to summarize.
message GetBillingSummaryRequest {
  string user_id = 1;
}

// GetBillingSummaryResponse returns the requested summary.
message GetBillingSummaryResponse {
  BillingSummary summary = 1;
}

// LedgerEntry is one row of billing.credit_ledger: an immutable credit
// movement. delta is negative for a reserve, zero for a settle (the
// reserve already moved the credits; settle only records which item_id
// they paid for), positive for a release or purchase.
message LedgerEntry {
  string id = 1;
  int64 delta = 2;
  string entry_type = 3;
  // item_id is only set on "settle" entries — the processing option id
  // (e.g. "summarize") the reservation was settled against.
  string item_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ListCreditLedgerRequest carries the user to list and cursor pagination.
// cursor is opaque, returned by a previous response's next_cursor.
message ListCreditLedgerRequest {
  string user_id = 1;
  string cursor = 2;
  int32 page_size = 3;
}

// ListCreditLedgerResponse returns one page of ledger entries, newest
// first. next_cursor is empty on the last page.
message ListCreditLedgerResponse {
  repeated LedgerEntry entries = 1;
  string next_cursor = 2;
}

// Plan is one subscribable Polar product, read live from Polar — never
// stored locally. id is the Polar product id, passed back verbatim to
// CreateCheckoutSession.
message Plan {
  string id = 1;
  string name = 2;
  string description = 3;
  // price_amount is 0 and price_currency is empty for a product with no
  // fixed price configured in Polar (e.g. a pay-what-you-want tier).
  int64 price_amount = 4;
  string price_currency = 5;
  // recurring_interval is "month" or "year".
  string recurring_interval = 6;
  repeated string benefits = 7;
}

message ListPlansRequest {
}

// ListPlansResponse returns every active, non-archived, recurring Polar
// product. There is no "free" entry: the free tier is simply the absence
// of an active subscription (BillingSummary.subscription unset).
message ListPlansResponse {
  repeated Plan plans = 1;
}

// CreateCheckoutSessionRequest identifies the checking-out user and which
// Polar product they selected — plan_id is a Plan.id (from ListPlans) for
// a subscription, or a CreditPack.id (from ListCreditPacks) for a
// one-time top-up; Polar checkout works identically for both.
message CreateCheckoutSessionRequest {
  string user_id = 1;
  string user_email = 2;
  string plan_id = 3;
}

// CreateCheckoutSessionResponse carries the Polar-hosted checkout URL to
// redirect the user to.
message CreateCheckoutSessionResponse {
  string checkout_url = 1;
}

// CancelSubscriptionRequest identifies the user whose active subscription
// should be canceled.
message CancelSubscriptionRequest {
  string user_id = 1;
}

message CancelSubscriptionResponse {
  Subscription subscription = 1;
}

// CreditPack is one one-time, non-recurring Polar product configured to
// grant a fixed number of credits on purchase, read live from Polar —
// never stored locally. id is the Polar product id, passed back verbatim
// to CreateCheckoutSession.
message CreditPack {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 credits = 4;
  int64 price_amount = 5;
  string price_currency = 6;
}

message ListCreditPacksRequest {
}

message ListCreditPacksResponse {
  repeated CreditPack packs = 1;
}
