query Quote($options: [String!]!) {
	quote(options: $options) {
		id
		catalogVersion
		totalCredits
		expiresAt
		items {
			itemId
			credits
		}
	}
}

query BillingSummary {
	billingSummary {
		availableCredits
		reservedCredits
		subscription {
			id
			plan
			status
			periodStart
			periodEnd
		}
	}
}
