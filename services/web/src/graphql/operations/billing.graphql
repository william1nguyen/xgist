query Quote($options: [String!]!) {
	quote(options: $options) {
		id
		catalogVersion
		totalCredits
		expiresAt
		items {
			itemId
			credits
		}
	}
}

query PriceCatalog {
	priceCatalog {
		catalogVersion
		items {
			itemId
			credits
		}
	}
}

query CreditLedgerHistory($cursor: String, $pageSize: Int) {
	creditLedgerHistory(cursor: $cursor, pageSize: $pageSize) {
		items {
			id
			delta
			entryType
			itemId
			createdAt
		}
		nextCursor
	}
}

query BillingSummary {
	billingSummary {
		availableCredits
		reservedCredits
		subscription {
			id
			plan
			status
			periodStart
			periodEnd
		}
	}
}

query Plans {
	plans {
		id
		name
		description
		priceAmount
		priceCurrency
		recurringInterval
		benefits
	}
}

query CreditPacks {
	creditPacks {
		id
		name
		description
		credits
		priceAmount
		priceCurrency
	}
}

mutation CreateCheckoutSession($planId: String!) {
	createCheckoutSession(planId: $planId) {
		checkoutUrl
	}
}

mutation CancelSubscription {
	cancelSubscription {
		id
		plan
		status
		periodStart
		periodEnd
	}
}
