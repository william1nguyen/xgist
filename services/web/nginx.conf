server {
    # docker-compose runs this container with network_mode: host (see
    # docker-compose.yml's comment on why), so this is the actual host
    # port, not something remapped by a `ports:` entry.
    listen 3000;
    server_name localhost;

    # Same-origin transport for the GraphQL client (see src/graphql/client.ts
    # and vite.config.ts's dev-time equivalent): hermes never needs to grant
    # CORS because the browser only ever talks to this origin. hermes is
    # host-networked too, so it's reachable at localhost directly.
    location /graphql {
        proxy_pass http://localhost:8086/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
