networks:
  default:
    driver: bridge

services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: media_notes
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d media_notes"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: mukI3zVZQx-6q9pdGOQp2w
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for host clients (go run ... on the host machine,
      # matching how postgres/redis/minio are reached below); INTERNAL is
      # for other containers on the default network. See
      # docs/local-infrastructure.md for the required topology.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - default
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    networks:
      - default
    restart: unless-stopped

  redis:
    image: bitnamilegacy/redis:7.2.5
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redisadmin}
    networks:
      - default
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - default
    restart: unless-stopped

  identity-migrate:
    image: flyway/flyway:11
    container_name: identity-migrate
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/identity/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/identity
      -user=identity -password=identity
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate
    networks:
      - default

  identity:
    build:
      context: .
      dockerfile: services/identity/identity.dockerfile
    container_name: identity
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://identity:identity@postgres:5432/identity?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      IDENTITY_HTTP_ADDR: :8081
      IDENTITY_GRPC_ADDR: :9091
      LOG_LEVEL: info
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

  billing-migrate:
    image: flyway/flyway:11
    container_name: billing-migrate
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/billing/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/billing
      -user=billing -password=billing
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate
    networks:
      - default

  billing:
    build:
      context: .
      dockerfile: services/billing/billing.dockerfile
    container_name: billing
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://billing:billing@postgres:5432/billing?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      BILLING_HTTP_ADDR: :8082
      BILLING_GRPC_ADDR: :9093
      BILLING_POLAR_WEBHOOK_SECRET: ${BILLING_POLAR_WEBHOOK_SECRET:-}
      LOG_LEVEL: info
    ports:
      - "8082:8082"
      - "9093:9093"
    depends_on:
      billing-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

  media-migrate:
    image: flyway/flyway:11
    container_name: media-migrate
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/media/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/media
      -user=media -password=media
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate
    networks:
      - default

  media:
    build:
      context: .
      dockerfile: services/media/media.dockerfile
    container_name: media
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://media:media@postgres:5432/media?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      MEDIA_HTTP_ADDR: :8083
      MEDIA_GRPC_ADDR: :19095
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_MEDIA_BUCKET: media
      LOG_LEVEL: info
    ports:
      - "8083:8083"
      - "19095:19095"
    depends_on:
      media-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

  content-migrate:
    image: flyway/flyway:11
    container_name: content-migrate
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/content/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/content
      -user=content -password=content
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate
    networks:
      - default

  content:
    build:
      context: .
      dockerfile: services/content/content.dockerfile
    container_name: content
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://content:content@postgres:5432/content?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      CONTENT_HTTP_ADDR: :8084
      CONTENT_GRPC_ADDR: :9095
      LOG_LEVEL: info
    ports:
      - "8084:8084"
      - "9095:9095"
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

  conductor-migrate:
    image: flyway/flyway:11
    container_name: conductor-migrate
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/conductor/migrations:/flyway/migrations:ro
    command: >
      -url=jdbc:postgresql://postgres:5432/workflow
      -user=conductor -password=conductor
      -locations=filesystem:/flyway/migrations
      -connectRetries=10
      migrate
    networks:
      - default

  conductor:
    build:
      context: .
      dockerfile: services/conductor/conductor.dockerfile
    container_name: conductor
    profiles: ["app"]
    environment:
      DATABASE_URL: postgres://conductor:conductor@postgres:5432/workflow?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      CONDUCTOR_HTTP_ADDR: :8085
      # conductor calls media and billing as a gRPC client (it has no
      # gRPC server of its own) — see docs/services/conductor.md.
      CONDUCTOR_MEDIA_GRPC_ADDR: media:19095
      CONDUCTOR_BILLING_GRPC_ADDR: billing:9093
      LOG_LEVEL: info
    ports:
      - "8085:8085"
    depends_on:
      conductor-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

  # conductor-worker: the Python executor pool (Whisper/Gemini/TTS/FFmpeg)
  # described in docs/services/worker.md, built from services/worker/.
  # Named distinctly from the legacy `worker` service below (apps/worker,
  # the v1 Redis-based pipeline), which is left running as-is — it isn't
  # part of the v2 Kafka architecture this stands up, and retiring it is a
  # separate decision.
  conductor-worker:
    build:
      context: .
      dockerfile: services/worker/worker.dockerfile
    container_name: conductor-worker
    profiles: ["app"]
    environment:
      KAFKA_BROKERS: kafka:29092
      WORKER_MEDIA_GRPC_ADDR: media:19095
      WORKER_CONTENT_GRPC_ADDR: content:9095
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_MEDIA_BUCKET: media
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WORKER_TTS_VOICE: en-US-AriaNeural
      LOG_LEVEL: info
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

  hermes:
    build:
      context: .
      dockerfile: services/hermes/hermes.dockerfile
    container_name: hermes
    profiles: ["app"]
    environment:
      HERMES_HTTP_ADDR: :8086
      HERMES_IDENTITY_GRPC_ADDR: identity:9091
      HERMES_BILLING_GRPC_ADDR: billing:9093
      HERMES_MEDIA_GRPC_ADDR: media:19095
      HERMES_CONTENT_GRPC_ADDR: content:9095
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redisadmin}
      LOG_LEVEL: info
    ports:
      - "8086:8086"
    depends_on:
      identity:
        condition: service_started
      billing:
        condition: service_started
      media:
        condition: service_started
      content:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
